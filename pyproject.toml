[project]
name = "copilot-ml"
version = "0.1.0"
description = "Minimal FastAPI Web API for Copilot enablement demos on Azure Container Apps."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "github-copilot-sdk>=0.3.0",
  "matplotlib>=3.10.9",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
